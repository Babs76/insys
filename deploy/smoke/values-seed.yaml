# The second phase of the smoke test (deploy/smoke/run.sh, "The OFTZA seed through Keycloak"): the same release upgraded to run as the Preview
# does, so the seed runs against a deployed API exactly as the Preview's provision and reset run it (Ade, 19 November 2026, batch 6 option (a)).
# Production (values.yaml) refuses the payment simulator, which the sample tenant uses, so the production checks run first and this follows.
# The operator tenant and its two platform administrators are the realm's own users, with the subjects deploy/keycloak/insys-realm.json gives them.
environment: Preview
declaredNonProduction: true
migrations:
  createRoles: true
  bootstrapOperator:
    enabled: true
    admin1: {subject: 0199f000-0000-7000-8000-0000000000a1, username: insys-admin, name: Platform Administrator}
    admin2: {subject: 0199f000-0000-7000-8000-0000000000a2, username: insys-admin-2, name: Second platform Administrator}
