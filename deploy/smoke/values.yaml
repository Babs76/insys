# Everything in the cluster, for the smoke test on a throwaway cluster. These are throwaway values, not secrets.
image:
  api: {repository: insys-api, tag: smoke}
  migrator: {repository: insys-migrator, tag: smoke}
  pullPolicy: Never
environment: Production
declaredNonProduction: false
operatorTenantId: 0199f000-0000-7000-8000-000000000001
secrets:
  migrationConnection: Host=insys-postgres;Database=insys;Username=insys_owner;Password=smoke-owner
  connectionTemplate: Host=insys-postgres;Database=insys;Username={role};Password=smoke-role
  rolePassword: smoke-role
  hashKey: c21va2Utc21va2Utc21va2Utc21va2Utc21va2Utc21vaw==
  kmsToken: smoke-kms-token
  objectStoreAccessKey: smoke-access
  objectStoreSecretKey: smoke-secret-key
  postgresPassword: smoke-owner
  keycloakAdminPassword: smoke-admin
authentication:
  authority: http://insys-keycloak:8080/realms/insys
  requireHttpsMetadata: false
migrations: {createRoles: true}
postgres: {enabled: true, storage: 2Gi}
openbao: {enabled: true}
seaweedfs: {enabled: true, storage: 2Gi}
keycloak: {enabled: true}
