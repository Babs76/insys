# Traefik, as k3s bundles it, with a Let's Encrypt resolver, le, using the TLS-ALPN-01 challenge, which needs only port 443 (no DNS token).
# Its certificates persist on a volume. preview.sh sets the CA: Let's Encrypt's staging service until issuance is proven, then the real one.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    persistence:
      enabled: true
      size: 128Mi
    deployment:
      initContainers:
        - name: acme-permissions
          image: busybox:1.37
          command: ["sh", "-c", "touch /data/acme.json && chmod 600 /data/acme.json"]
          volumeMounts: [{name: data, mountPath: /data}]
    ports:
      web:
        expose:
          default: false
    certificatesResolvers:
      le:
        acme:
          email: ACME_EMAIL
          storage: /data/acme.json
          caServer: ACME_CA
          tlsChallenge: {}
