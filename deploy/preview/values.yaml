# The INSYS Preview (docs/plans/insys-preview.md): one server, k3s, every dependency in the cluster and durable. Not production: sample data
# only, and every external integration a labelled stub. The domain-dependent values are set by deploy/preview/preview.sh; secrets live only on
# the server, in the Secret it makes (existingSecret), never here.
image:
  api: {repository: insys-api, tag: preview}
  migrator: {repository: insys-migrator, tag: preview}
  pullPolicy: Never
environment: Preview
declaredNonProduction: true
existingSecret: insys-secrets
# The realm's platform tenant, as its two platform users' tenant_id says (deploy/keycloak/insys-realm.json).
operatorTenantId: 0199f000-0000-7000-8000-000000000001
authentication:
  audience: insys-core-api
  requireHttpsMetadata: true
migrations:
  createRoles: true
  bootstrapOperator:
    enabled: true
    admin1: {subject: 0199f000-0000-7000-8000-0000000000a1, username: insys-admin, name: Platform Administrator}
    admin2: {subject: 0199f000-0000-7000-8000-0000000000a2, username: insys-admin-2, name: Second platform Administrator}
postgres: {enabled: true, storage: 20Gi}
openbao: {enabled: true, devMode: false, storage: 1Gi}
seaweedfs: {enabled: true, storage: 20Gi}
# The console's banner shows only after sign-in, so the sign-in page says it too.
keycloak: {enabled: true, devMode: false, realmDisplayName: "INSYS Preview (sample data only)"}
ingress:
  enabled: true
  className: traefik
  # Traefik's Let's Encrypt resolver, le, from deploy/preview/traefik.yaml.
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
