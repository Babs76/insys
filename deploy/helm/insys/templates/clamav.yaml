{{- if .Values.scanner.enabled }}
# The malware scanner for uploaded documents (AIA-010, ai-assist.md §5.5): clamd on 3310. The image updates its signatures with freshclam at
# start and then daily, so the pod needs egress to the ClamAV signature mirror. It's ready only once clamd answers, after the first download.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-clamav
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav
        {{- include "insys.labels" . | nindent 8 }}
    spec:
      containers:
        - name: clamav
          image: {{ .Values.scanner.image }}
          ports:
            - {name: clamd, containerPort: 3310}
          readinessProbe:
            tcpSocket: {port: clamd}
            periodSeconds: 10
            failureThreshold: 60
          resources: {{- toYaml .Values.scanner.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-clamav
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  ports: [{name: clamd, port: 3310, targetPort: clamd}]
  selector:
    app.kubernetes.io/name: clamav
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
