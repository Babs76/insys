{{- if .Values.postgres.enabled }}
{{- if and .Values.keycloak.enabled (not .Values.keycloak.devMode) }}
# Keycloak's own database, made when the volume is new.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  labels: {{- include "insys.labels" . | nindent 4 }}
data:
  keycloak.sql: CREATE DATABASE keycloak;
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        {{- include "insys.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, insys_owner, -d, {{ .Values.postgres.database | quote }}]}
          env:
            - {name: POSTGRES_USER, value: insys_owner}
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            {{- include "insys.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "postgresPassword") | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            {{- if and .Values.keycloak.enabled (not .Values.keycloak.devMode) }}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            {{- end }}
      {{- if and .Values.keycloak.enabled (not .Values.keycloak.devMode) }}
      volumes:
        - name: init
          configMap: {name: {{ .Release.Name }}-postgres-init}
      {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
