{{- if .Values.seaweedfs.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-seaweedfs-s3
  labels: {{- include "insys.labels" . | nindent 4 }}
stringData:
  s3.json: |
    {"identities": [{"name": "insys", "credentials": [{"accessKey": {{ .Values.secrets.objectStoreAccessKey | quote }}, "secretKey": {{ .Values.secrets.objectStoreSecretKey | quote }}}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-seaweedfs
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        {{- include "insys.labels" . | nindent 8 }}
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image }}
          args: [server, -dir=/data, -s3, -s3.config=/etc/seaweedfs/s3.json]
          ports: [{name: s3, containerPort: 8333}]
          readinessProbe:
            tcpSocket: {port: s3}
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - until printf 's3.bucket.create -name {{ .Values.objectStore.bucket }}\ns3.bucket.list\n' | weed shell 2>&1 | grep -q '{{ .Values.objectStore.bucket }}.*size'; do sleep 2; done
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: config
          secret: {secretName: {{ .Release.Name }}-seaweedfs-s3}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.seaweedfs.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-seaweedfs
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  ports: [{name: s3, port: 8333, targetPort: s3}]
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
