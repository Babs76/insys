{{- if .Values.seaweedfs.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-seaweedfs
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        {{- include "insys.labels" . | nindent 8 }}
    spec:
      # Its S3 identity from the release's Secret, the same keys the API signs with (objectStoreAccessKey, objectStoreSecretKey), so the two
      # always agree. Built from the values before, it was empty wherever the Secret is made outside the chart (existingSecret, the INSYS
      # Preview), and every document write failed (rotate-passwords run 42080719155: POST /documents/documents, 500).
      initContainers:
        - name: s3-config
          image: {{ .Values.seaweedfs.image }}
          command:
            - sh
            - -c
            - |
              printf '{"identities": [{"name": "insys", "credentials": [{"accessKey": "%s", "secretKey": "%s"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}' "$ACCESS_KEY" "$SECRET_KEY" > /config/s3.json
          env:
            {{- include "insys.secretEnv" (dict "root" . "name" "ACCESS_KEY" "key" "objectStoreAccessKey") | nindent 12 }}
            {{- include "insys.secretEnv" (dict "root" . "name" "SECRET_KEY" "key" "objectStoreSecretKey") | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /config}
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image }}
          args: [server, -dir=/data, -s3, -s3.config=/etc/seaweedfs/s3.json]
          ports: [{name: s3, containerPort: 8333}]
          readinessProbe:
            tcpSocket: {port: s3}
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - until printf 's3.bucket.create -name {{ .Values.objectStore.bucket }}\ns3.bucket.list\n' | weed shell 2>&1 | grep -q '{{ .Values.objectStore.bucket }}.*size'; do sleep 2; done
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.seaweedfs.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-seaweedfs
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  ports: [{name: s3, port: 8333, targetPort: s3}]
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
