{{- if .Values.openbao.enabled }}
{{- if .Values.openbao.devMode }}
# Development mode: in memory, so a restart loses every key and so every encrypted field. For the smoke of an install only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-openbao
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
        {{- include "insys.labels" . | nindent 8 }}
    spec:
      containers:
        - name: openbao
          image: {{ .Values.openbao.image }}
          ports: [{name: http, containerPort: 8200}]
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: http}
          env:
            - {name: BAO_DEV_LISTEN_ADDRESS, value: "0.0.0.0:8200"}
            {{- include "insys.secretEnv" (dict "root" . "name" "BAO_DEV_ROOT_TOKEN_ID" "key" "kmsToken") | nindent 12 }}
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    export BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN="$BAO_DEV_ROOT_TOKEN_ID"
                    until bao status >/dev/null 2>&1; do sleep 1; done
                    bao secrets enable -path={{ .Values.kms.mount }} transit || true
                    bao write -f {{ .Values.kms.mount }}/keys/{{ .Values.kms.keyName }}
{{- else }}
# Durable: its keys on a volume, so they survive a restart (register row 1). It starts sealed, and after every restart, until someone holding an
# unseal key unseals it; the chart holds no key. deploy/openbao/openbao.sh initialises, unseals and configures it, its secrets only on stdin and stdout.
# Ready means it answers, sealed or not: the API's protected fields wait for the unseal.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-openbao
  labels: {{- include "insys.labels" . | nindent 4 }}
data:
  config.hcl: |-
    ui = false
    disable_mlock = true
    api_addr = "http://127.0.0.1:8200"
    storage "file" {
      path = "/openbao/data"
    }
    listener "tcp" {
      address = "0.0.0.0:8200"
      tls_disable = true
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-openbao
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-openbao
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
        {{- include "insys.labels" . | nindent 8 }}
    spec:
      containers:
        - name: openbao
          image: {{ .Values.openbao.image }}
          args: [server, -config=/openbao/config/config.hcl]
          ports: [{name: http, containerPort: 8200}]
          readinessProbe:
            httpGet: {path: "/v1/sys/health?uninitcode=200&sealedcode=200", port: http}
          volumeMounts:
            - {name: data, mountPath: /openbao/data}
            - {name: config, mountPath: /openbao/config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-openbao}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.openbao.storage }}}}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-openbao
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  ports: [{name: http, port: 8200, targetPort: http}]
  selector:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
