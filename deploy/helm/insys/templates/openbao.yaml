{{- if .Values.openbao.enabled }}
{{- if not .Values.openbao.devMode }}
{{- fail "The chart's in-cluster OpenBao only runs in development mode. Point kms.address at an OpenBao you run (docs/runbooks/deployment.md)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-openbao
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
        {{- include "insys.labels" . | nindent 8 }}
    spec:
      containers:
        - name: openbao
          image: {{ .Values.openbao.image }}
          ports: [{name: http, containerPort: 8200}]
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: http}
          env:
            - {name: BAO_DEV_LISTEN_ADDRESS, value: "0.0.0.0:8200"}
            {{- include "insys.secretEnv" (dict "root" . "name" "BAO_DEV_ROOT_TOKEN_ID" "key" "kmsToken") | nindent 12 }}
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    export BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN="$BAO_DEV_ROOT_TOKEN_ID"
                    until bao status >/dev/null 2>&1; do sleep 1; done
                    bao secrets enable -path={{ .Values.kms.mount }} transit || true
                    bao write -f {{ .Values.kms.mount }}/keys/{{ .Values.kms.keyName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-openbao
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  ports: [{name: http, port: 8200, targetPort: http}]
  selector:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
