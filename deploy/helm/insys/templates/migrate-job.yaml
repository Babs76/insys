# One job per release revision. It retries until the database answers; the API restarts until the migrations are in.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        {{- include "insys.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.migrator.repository }}:{{ .Values.image.migrator.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --migrations
            - db/migrations
            {{- if .Values.migrations.createRoles }}
            - --roles
            - db/roles
            {{- end }}
            {{- with .Values.migrations.bootstrapOperator }}
            {{- if .enabled }}
            # The operator tenant and its two platform administrators, from db/bootstrap/operator.sql: a run again changes nothing (BR-061).
            - --bootstrap-operator
            - {{ $.Values.operatorTenantId | quote }}
            {{- range $n, $admin := list .admin1 .admin2 }}
            - --admin{{ add1 $n }}-subject
            - {{ required "migrations.bootstrapOperator: each administrator's subject" $admin.subject | quote }}
            - --admin{{ add1 $n }}-username
            - {{ required "migrations.bootstrapOperator: each administrator's username" $admin.username | quote }}
            - --admin{{ add1 $n }}-name
            - {{ required "migrations.bootstrapOperator: each administrator's name" $admin.name | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          env:
            {{- include "insys.secretEnv" (dict "root" . "name" "INSYS_MIGRATION_CONNECTION" "key" "migrationConnection") | nindent 12 }}
            {{- if .Values.migrations.createRoles }}
            {{- include "insys.secretEnv" (dict "root" . "name" "INSYS_ROLE_PASSWORD" "key" "rolePassword") | nindent 12 }}
            {{- end }}
