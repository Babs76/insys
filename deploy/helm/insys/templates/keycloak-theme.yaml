# Keycloak's login theme insys (BR-168): the console's theme, from files/keycloak-theme/insys/ (tools/sync-keycloak-theme.sh). Rendered only
# when those files exist; keycloak.yaml mounts it at /opt/keycloak/themes/insys. Its own template so the Preview's keycloak-theme action can
# render exactly this ConfigMap (--show-only) and apply it before any upgrade, and a later upgrade or reset takes it over (theme-mount.sh).
{{- if .Values.keycloak.enabled }}
{{- $theme := include "insys.keycloakTheme" . | fromJson }}
{{- if $theme }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-theme
  labels: {{- include "insys.labels" . | nindent 4 }}
binaryData:
  {{- range $key := keys $theme | sortAlpha }}
  {{ $key }}: {{ get $theme $key }}
  {{- end }}
{{- end }}
{{- end }}
