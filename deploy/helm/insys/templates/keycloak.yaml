{{- if .Values.keycloak.enabled }}
{{- $realm := .Files.Get "files/insys-realm.json" }}
{{- with .Values.keycloak.realmDisplayName }}
{{- /* The sign-in page's title and heading. Keycloak imports the realm only when it doesn't exist yet, so this names a new realm. */}}
{{- $parsed := fromJson $realm }}
{{- $_ := set $parsed "displayName" . }}
{{- $_ := set $parsed "displayNameHtml" (html .) }}
{{- $realm = toPrettyJson $parsed }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-realm
  labels: {{- include "insys.labels" . | nindent 4 }}
data:
  insys-realm.json: |-
{{ $realm | indent 4 }}
---
# devMode: start-dev, with its data in the container, so a restart loses every account. Otherwise production mode with its data in the in-cluster
# PostgreSQL (its own database, keycloak), so accounts survive a restart; TLS ends at the Ingress, so Keycloak serves HTTP behind it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        {{- include "insys.labels" . | nindent 8 }}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          {{- if .Values.keycloak.devMode }}
          args: [start-dev, --import-realm, --health-enabled=true]
          {{- else }}
          args:
            - start
            - --import-realm
            - --health-enabled=true
            - --http-enabled=true
            - --proxy-headers=xforwarded
            {{- if .Values.keycloak.hostname }}
            - --hostname={{ .Values.keycloak.hostname }}
            # The API's calls inside the cluster get the cluster's addresses for the keys and tokens; tokens keep the public issuer.
            - --hostname-backchannel-dynamic=true
            {{- else }}
            - --hostname-strict=false
            {{- end }}
          {{- end }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 5
            failureThreshold: 60
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            {{- include "insys.secretEnv" (dict "root" . "name" "KC_BOOTSTRAP_ADMIN_PASSWORD" "key" "keycloakAdminPassword") | nindent 12 }}
            {{- if not .Values.keycloak.devMode }}
            {{- if not .Values.postgres.enabled }}
            {{- fail "keycloak.devMode false keeps Keycloak's data in the in-cluster PostgreSQL: enable postgres, or run Keycloak outside the chart." }}
            {{- end }}
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: {{ printf "jdbc:postgresql://%s-postgres:5432/keycloak" .Release.Name | quote }}}
            - {name: KC_DB_USERNAME, value: insys_owner}
            {{- include "insys.secretEnv" (dict "root" . "name" "KC_DB_PASSWORD" "key" "postgresPassword") | nindent 12 }}
            {{- end }}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: {{ .Release.Name }}-keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak
  labels: {{- include "insys.labels" . | nindent 4 }}
spec:
  ports: [{name: http, port: 8080, targetPort: http}]
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- with .Values.keycloak.ingressHost }}
---
# Sign-in only: /realms/ and /resources/ are routed, so Keycloak's admin console isn't public.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-keycloak
  labels: {{- include "insys.labels" $ | nindent 4 }}
  {{- with $.Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ . | quote }}
      http:
        paths:
          {{- range list "/realms/" "/resources/" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-keycloak
                port: {name: http}
          {{- end }}
{{- end }}
{{- end }}
