# Each dependency is either in the cluster (enabled: true) or pointed at (enabled: false, with its address).
# The in-cluster ones are single nodes with no high availability: for evaluation and the smoke test, not for production (docs/runbooks/deployment.md).
image:
  api: {repository: insys-api, tag: latest}
  migrator: {repository: insys-migrator, tag: latest}
  pullPolicy: IfNotPresent

# ASPNETCORE_ENVIRONMENT. Production refuses the payment simulator unless declaredNonProduction is set.
environment: Production
declaredNonProduction: false

# A secret you made, with the keys listed in secrets below. When empty, the chart makes one from secrets.
existingSecret: ""
secrets:
  migrationConnection: ""   # The owner role's connection string, for migrations only.
  connectionTemplate: ""    # The API's connection string, with {role} standing for the module role. Never an owner or superuser.
  rolePassword: ""          # Creates the module login roles when migrations.createRoles is true.
  hashKey: ""               # FieldProtection:HashKey. Can't be rotated in place (OQ-020).
  kmsToken: ""              # The OpenBao token: only datakey/plaintext and decrypt on the Transit key.
  objectStoreAccessKey: ""
  objectStoreSecretKey: ""
  postgresPassword: ""      # In-cluster PostgreSQL only.
  keycloakAdminPassword: "" # In-cluster Keycloak only.

operatorTenantId: "00000000-0000-0000-0000-000000000000"

authentication:
  authority: ""                 # The issuer, such as https://id.example.com/realms/insys.
  issuer: ""                    # The tokens' issuer, when the API reaches Keycloak at another address than authority (the Preview: in the cluster).
  audience: insys-core-api
  requireHttpsMetadata: true

migrations:
  # Production creates its roles and credentials outside the chart (OQ-004).
  createRoles: false
  backoffLimit: 20
  # Creates the operator tenant (operatorTenantId) and its two platform administrators, once, for a new deployment that signs in through Keycloak:
  # each subject is the administrator's Keycloak user id.
  bootstrapOperator:
    enabled: false
    admin1: {subject: "", username: "", name: ""}
    admin2: {subject: "", username: "", name: ""}

api:
  resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 2Gi}}
  service: {type: ClusterIP, port: 8080}

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
  apiPath: /        # /api/ where the API shares its host with the console (ADR-027).
  annotations: {}   # The ingress controller's own, such as Traefik's certificate resolver; none by default.

# The front end's four apps, from its published image, pinned by digest (ADR-027, BR-132). Off here, as it needs its host
# (ingress.host, with ingress.apiPath /api/) and Keycloak's https issuer (authentication.authority); the INSYS Preview turns it on.
console:
  enabled: false
  image: ghcr.io/babs76/insys-console-web@sha256:e0c06bb54292593cd9f3f6471e79dbeae4ebae3e5ca11c56559b3f7918ee865f
  replicas: 1          # Static files: as many as you like. Only the API is one instance (ADR-006).
  pullSecret: ""       # A docker-registry secret for ghcr.io, made in the cluster: the package is private. Never in these values.
  environmentName: ""  # Shown in the apps' top bar, except "production".
  issuer: ""           # Keycloak's issuer as the browser sees it, when it isn't authentication.authority.

postgres:
  enabled: false
  image: postgres:18
  database: insys
  storage: 10Gi

kms:
  keyName: insys
  mount: transit
  address: ""     # When openbao.enabled is false.

openbao:
  enabled: false
  image: quay.io/openbao/openbao:2.6.5
  # devMode: in memory, so a restart loses every key and so every encrypted field; never for real data. Otherwise durable, on a volume, and sealed
  # at start and after every restart until unsealed (deploy/openbao/openbao.sh). Still a single node: high availability is the runbook's (ADR-027).
  devMode: true
  storage: 1Gi

objectStore:
  serviceUrl: ""  # When seaweedfs.enabled is false.
  region: us-east-1
  bucket: insys-documents
  forcePathStyle: true

seaweedfs:
  enabled: false
  image: chrislusf/seaweedfs:3.97
  storage: 5Gi

keycloak:
  enabled: false
  image: quay.io/keycloak/keycloak:26.7.5
  # devMode: start-dev, its accounts lost on a restart. Otherwise production mode on the in-cluster PostgreSQL (postgres.enabled).
  devMode: true
  hostname: ""   # Its public address, such as https://id.example.com. Empty: any host is accepted (the smoke test).
  ingressHost: "" # Routes sign-in (only /realms/ and /resources/) from this host, such as id.example.com, through the chart's Ingress settings.
  realmDisplayName: "" # The sign-in page's title and heading for a new realm. Empty: the realm file's own.
