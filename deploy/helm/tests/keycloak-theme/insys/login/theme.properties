# A stand-in for the console's login theme insys (BR-168), for the chart's tests only: never copied into the chart's files/. Like the real one,
# it extends Keycloak 26.7.5's keycloak.v2 with a template, an English message bundle and one stylesheet, and has no scripts of its own.
parent=keycloak.v2
import=common/keycloak
locales=en
styles=css/styles.css css/insys.css
