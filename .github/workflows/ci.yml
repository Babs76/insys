name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The test jobs run in parallel (checkpoint A): unit and architecture tests; integration tests in three shards balanced
# from measured class times; and the endpoint security sweeps with the end-to-end processes. Each builds with warnings
# as errors.
jobs:
  unit-and-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # File-sync conflict copies ("Foo 2.cs", "bin/Debug 2") once broke the build (OQ-039).
      - name: No conflict copies
        run: |
          copies=$(find . -path ./.git -prune -o \( -name '* 2.*' -o -name '* 2' \) -print)
          if [ -n "$copies" ]; then
            echo "Conflict copies found:"; echo "$copies"; exit 1
          fi

      # Every source file we own carries the OpenFactor header with its component (tools/source-header.txt).
      - name: Source file headers
        run: python3 tools/source-headers.py --check

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      # TreatWarningsAsErrors is set in Directory.Build.props. The host build also writes the OpenAPI documents.
      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      # Every test project in the solution runs in exactly one job: here (tests/Insys.*Tests) or, for the two that need
      # PostgreSQL, in the integration and sweeps-and-end-to-end jobs. A test project outside that pattern fails here.
      - name: Every test project runs in a job
        run: |
          strays=$(grep -oE 'tests/[^"]+\.csproj' Insys.slnx | grep -vE '^tests/Insys\.[A-Za-z.]*Tests/' | grep -v '^tests/Insys.Testing/' || true)
          if [ -n "$strays" ]; then
            echo "Test projects no job runs:"; echo "$strays"; exit 1
          fi

      # Every test project except the two that need PostgreSQL.
      - name: Unit and architecture tests
        run: |
          for project in tests/Insys.*Tests/*.csproj; do
            case "$project" in
              */Insys.IntegrationTests/*|*/Insys.EndToEndTests/*) continue ;;
            esac
            dotnet test --project "$project" --no-build --configuration Release
          done

      - name: OpenAPI documents are committed and current
        run: git diff --exit-code docs/api/

  # The integration split for this run, made once so every shard runs the same split: from the class times the latest
  # successful run on main measured (its integration-timings artifact), else the committed timings file. A class never
  # measured is estimated from its tests (tools/integration-shards.py).
  # A migration numbered at or below main's highest would be refused by every database already migrated from main (batch 7.8's V0145, after V0146).
  migration-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Added migrations are numbered above main's
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 tools/migration-numbers.py --base origin/main

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: The chart's realm is the repository's
        run: cmp deploy/keycloak/insys-realm.json deploy/helm/insys/files/insys-realm.json

      - name: The chart lints and renders, with each dependency in the cluster and pointed at
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm/insys:/apps" alpine/helm:3.19.0 "$@"; }
          helm lint . --set kms.address=http://bao:8200,objectStore.serviceUrl=http://s3:9000
          helm template t . --set kms.address=http://bao:8200,objectStore.serviceUrl=http://s3:9000 > /dev/null
          helm template t . --set postgres.enabled=true,openbao.enabled=true,seaweedfs.enabled=true,keycloak.enabled=true > /dev/null
          # AIA-010: the chart pins ClamAV whatever the environment is called, and refuses the development scanner.
          helm template t . --set kms.address=http://bao:8200,objectStore.serviceUrl=http://s3:9000,environment=Development | grep -q 'name: Documents__Scanner__Provider, value: "clamav"'
          if helm template t . --set kms.address=http://bao:8200,objectStore.serviceUrl=http://s3:9000,environment=Development,scanner.provider=development > /dev/null 2>&1; then
            echo "The chart rendered with scanner.provider=development"; exit 1
          fi
          # The same for AI Assist's stand-in model (BR-147): none by default, and refused whatever the environment is called.
          helm template t . --set kms.address=http://bao:8200,objectStore.serviceUrl=http://s3:9000,environment=Development | grep -q 'name: Assist__Provider, value: "none"'
          if helm template t . --set kms.address=http://bao:8200,objectStore.serviceUrl=http://s3:9000,environment=Development,assist.provider=development > /dev/null 2>&1; then
            echo "The chart rendered with assist.provider=development"; exit 1
          fi
          if helm template t . --set kms.address=http://bao:8200,objectStore.serviceUrl=http://s3:9000 | grep -E 'annotations:|replicas: [^1]'; then
            echo "The chart has a provider annotation or more than one replica (ADR-006, ADR-027)."
            exit 1
          fi

      # BR-168: the console's login theme renders both ways. With no files in files/keycloak-theme/insys/ nothing extra renders; with a stand-in
      # theme (deploy/helm/tests/keycloak-theme, copied into a copy of the chart, never into the chart) the ConfigMap, its items, the read-only
      # mount and the checksum annotation that deploy/keycloak/theme-mount.sh computes on the Preview.
      - name: The chart's Keycloak login theme
        run: deploy/helm/tests/keycloak-theme.sh

      # Ade, 26 November 2026: the Preview's upgrade check (preview.sh upgrade_check), against a stubbed server and tool: a clear report passes,
      # listed approval types fail the run with them by tenant, and an API error fails it too.
      - name: The Preview's upgrade check
        run: deploy/helm/tests/preview-upgrade-check.sh

      # Ade, 26 November 2026: the Preview's read-authority action (preview.sh read_authority), against a stubbed server: it only opens SSH and
      # reads, its SQL has no statement that writes, carries the read-only guards and rolls back, and psql connects read only.
      - name: The Preview's read-authority action
        run: deploy/helm/tests/preview-read-authority.sh

      # Ade, 27 November 2026: the Preview upgrade's release check (preview.sh running_release), against a stubbed server: it passes only on the
      # release's migrations with their checksums and an API whose Insys assemblies hold the release's texts; anything else fails the run.
      - name: The Preview upgrade's release check
        run: deploy/helm/tests/preview-release-check.sh

      # Ade, 27 November 2026: a Preview run with no ACME value fails instead of defaulting to staging (preview.sh acme_service), and the
      # workflow passes the run's acme input or the Environment's PREVIEW_ACME, with no default of its own.
      - name: The Preview's ACME value is required
        run: deploy/helm/tests/preview-acme.sh

      # Ade, 22 November 2026: the vendored theme is exactly the approved files, with their sha256 (files/keycloak-theme/insys.sha256), and
      # insys.commit their source commit. Any other file, another theme type than login/ included, fails.
      - name: The vendored Keycloak theme is exactly the approved files
        run: tools/sync-keycloak-theme.sh --check

      - name: The Keycloak theme scripts parse
        run: |
          for f in tools/sync-keycloak-theme.sh deploy/keycloak/realm-login-theme.sh deploy/keycloak/theme-check-user.sh deploy/keycloak/theme-mount.sh \
            deploy/helm/tests/keycloak-theme.sh deploy/helm/tests/preview-upgrade-check.sh deploy/helm/tests/preview-read-authority.sh deploy/helm/tests/preview-release-check.sh deploy/helm/tests/preview-release-images.sh deploy/helm/tests/preview-acme.sh deploy/preview/preview.sh; do bash -n "$f"; done
          node --check deploy/keycloak/theme-check.cjs
          shellcheck tools/sync-keycloak-theme.sh deploy/keycloak/realm-login-theme.sh deploy/keycloak/theme-check-user.sh deploy/keycloak/theme-mount.sh \
            deploy/helm/tests/keycloak-theme.sh deploy/helm/tests/preview-upgrade-check.sh deploy/helm/tests/preview-read-authority.sh deploy/helm/tests/preview-release-check.sh deploy/helm/tests/preview-release-images.sh deploy/helm/tests/preview-acme.sh deploy/preview/preview.sh

      - name: The images build
        run: |
          docker build -q -f deploy/docker/api.Dockerfile --build-arg REVISION="$GITHUB_SHA" -t insys-api -t "insys-api:$GITHUB_SHA" .
          docker build -q -f deploy/docker/migrator.Dockerfile --build-arg REVISION="$GITHUB_SHA" -t insys-migrator -t "insys-migrator:$GITHUB_SHA" .
          # Each image records its commit (Ade, 27 November 2026): the OCI revision label, and a build without one is refused.
          for image in insys-api insys-migrator; do
            label=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:$GITHUB_SHA")
            [ "$label" = "$GITHUB_SHA" ] || { echo "::error::$image's revision label is '$label', not $GITHUB_SHA"; exit 1; }
          done
          if docker build -q -f deploy/docker/api.Dockerfile -t insys-api:no-revision . >/dev/null 2>&1; then
            echo "::error::the API image built without a commit"; exit 1
          fi

      # Ade, 27 November 2026: the Preview upgrade's API check on real images. The API image built from ca1bf2b, as the Preview's reset built
      # it, matches deploy/preview/release-ca1bf2b.fingerprint, and this checkout's image (insys-api, just built) doesn't.
      - name: The Preview upgrade's API check, on real images
        run: deploy/helm/tests/preview-release-images.sh insys-api

  integration-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Latest measured class times from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ] && gh run download "$run" --repo "$GITHUB_REPOSITORY" --name integration-timings --dir /tmp/main-timings; then
            cp /tmp/main-timings/class-timings.json tests/Insys.IntegrationTests/class-timings.json
            echo "Balanced from the class times of main's run $run."
          else
            echo "No measured times from main; balanced from the committed tests/Insys.IntegrationTests/class-timings.json."
          fi

      - name: Every integration class is in exactly one shard
        run: python3 tools/integration-shards.py --check 6

      - uses: actions/upload-artifact@v4
        with:
          name: integration-plan
          path: tests/Insys.IntegrationTests/class-timings.json

  integration:
    needs: integration-plan
    runs-on: ubuntu-latest
    # 30 minutes in one job on Wave 1 batch 3, two shards from then, three from Wave 2 batch 4 (two passed 42 minutes),
    # four from 29 October 2026 (a shard reached 29.5 minutes; Ade: every job well under 20), each with its own
    # PostgreSQL container. The 45-minute limit is the alarm: the timings job warns past 35.
    strategy:
      fail-fast: false
      matrix:
        # Six from 26 November 2026: with four, each took 38 to 40 minutes, past the 35-minute warning, and one ran out at 45 while
        # four runs shared the runners (run 45839852644, a docs-only change). Six puts each near 28 minutes (Est).
        shard: [1, 2, 3, 4, 5, 6]
    name: integration (${{ matrix.shard }} of 6)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: integration-plan
          path: tests/Insys.IntegrationTests

      - name: Every integration class is in exactly one shard
        run: python3 tools/integration-shards.py --check 6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      - name: Every compiled integration class runs in a shard or the sweeps job
        run: tests/Insys.IntegrationTests/bin/Release/net10.0/Insys.IntegrationTests -list classes | python3 tools/integration-shards.py --check-listed 6

      # Testcontainers starts postgres:18 (Docker is available on ubuntu-latest). The endpoint sweeps run in their own job.
      # The xUnit report gives each class's measured time to the timings job.
      - name: Integration tests
        run: >-
          eval dotnet test --project tests/Insys.IntegrationTests --no-build --configuration Release --results-directory "$RUNNER_TEMP/results"
          -- --report-xunit-xml --report-xunit-xml-filename shard-${{ matrix.shard }}.xml $(python3 tools/integration-shards.py ${{ matrix.shard }} 6)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/results/shard-${{ matrix.shard }}.xml
          if-no-files-found: warn

  # Measures every class from the shards' reports into the integration-timings artifact the next run balances from (a
  # class whose shard wrote no report keeps its last time), and reports each shard's time, warning past 35 minutes.
  integration-timings:
    needs: [integration-plan, integration]
    if: always() && needs.integration-plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: integration-plan
          path: tests/Insys.IntegrationTests

      - uses: actions/download-artifact@v4
        with:
          pattern: integration-report-*
          path: reports
          merge-multiple: true

      - name: Measure each class
        env:
          INSYS_SHARD_SOURCE: CI run ${{ github.run_id }} (${{ github.ref_name }}, ${{ github.sha }})
        run: python3 tools/integration-shards.py --measure reports/*.xml

      - uses: actions/upload-artifact@v4
        with:
          name: integration-timings
          path: tests/Insys.IntegrationTests/class-timings.json

      - name: Shard times
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A shard that has only just finished may not show its completion time yet: it is measured to now.
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.name | startswith("integration (")) | [.name, .startedAt, (.completedAt // ""), (.conclusion // "")] | @tsv' | sort |
          while IFS=$'\t' read -r name started completed conclusion; do
            case "$completed" in ""|0001-*) end=$(date +%s) ;; *) end=$(date -d "$completed" +%s) ;; esac
            seconds=$(( end - $(date -d "$started" +%s) ))
            minutes="$(( seconds / 60 )).$(( seconds % 60 * 10 / 60 ))"
            echo "$name: $minutes min (${conclusion:-finishing})" | tee -a "$GITHUB_STEP_SUMMARY"
            # Past 35 minutes to the second: 35 min 30 s is over the alarm, though it rounds down to 35.
            if [ "$seconds" -gt 2100 ]; then echo "::warning title=Integration shard over 35 minutes::$name took $minutes minutes (limit 45)."; fi
          done

  # The sample tenant's seed (Workstream F), loaded on a fresh database through the API and read back, in jobs of its own:
  # the resume test stops it after every kind of step and runs it again. It passed 50 minutes alone as the seed grew (18 November 2026),
  # so its kinds of step are split in two classes, each in a job. The classes are in tools/integration-shards.py's SEED, so the shards leave them out.
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            classes: OftzaSeedResumeTests
          - group: 2
            classes: OftzaSeedResumeLaterTests
          - group: 3
            classes: OftzaSeedTests OftzaSeedRestoreTests OftzaSeedWindowTests
    name: seed (${{ matrix.group }} of 3)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      - name: The seed's classes are the ones the shards leave out
        run: |
          grouped=$(echo "OftzaSeedResumeTests OftzaSeedResumeLaterTests OftzaSeedTests OftzaSeedRestoreTests OftzaSeedWindowTests" | tr ' ' '\n' | sort)
          excluded=$(python3 -c "import runpy; print('\n'.join(sorted(runpy.run_path('tools/integration-shards.py', run_name='shards')['SEED'])))")
          if [ "$grouped" != "$excluded" ]; then echo "The seed jobs and the shards' SEED differ:"; diff <(echo "$grouped") <(echo "$excluded"); exit 1; fi

      - name: Seed (${{ matrix.classes }})
        run: >-
          dotnet test --project tests/Insys.IntegrationTests --no-build --configuration Release --
          $(for c in ${{ matrix.classes }}; do printf -- '--filter-class "*.%s" ' "$c"; done)

  # Split by end-to-end test class. Two jobs from 29 October 2026 (one took 27.6 minutes; Ade: every job well under 20); four
  # from 22 November 2026 (Ade, option c), after the Life, Health and Enterprise group took 36 to 42 minutes against the 45-minute
  # limit (runs 44920405075, 44916260638). GeneralProcessTests, the heaviest class, runs alone, and the sweeps run with the two
  # light classes. Every end-to-end class runs in exactly one group (checked below), so a new class cannot be left out.
  # Six from 27 November 2026 (Ade): GeneralProcessTests alone took 23 to 45 minutes on the same code (run 45959851262 was cut
  # off at 45), so it runs as three shards by test method, like the dated jobs (tools/end-to-end-shards.py --class).
  # Every end-to-end job runs the test assembly's own runner with -reporter verbose, so each test's start and end are in the
  # job's log as they happen, and a hang (a test started and never ended) can be told from slowness.
  sweeps-and-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            classes: GeneralProcessTests
            shard: 1
          - group: 2
            classes: GeneralProcessTests
            shard: 2
          - group: 3
            classes: GeneralProcessTests
            shard: 3
          - group: 4
            classes: HealthProcessTests
          - group: 5
            classes: LifeProcessTests EnterpriseProcessTests
          - group: 6
            classes: ProductPublicationTests ProcessTests
    name: sweeps-and-end-to-end (${{ matrix.group }} of 6)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      - name: Every end-to-end class runs in exactly one group
        run: |
          listed=$(tests/Insys.EndToEndTests/bin/Release/net10.0/Insys.EndToEndTests -list classes | grep -oE 'Insys\.EndToEndTests\.[A-Za-z]+' | sed 's/.*\.//' | sort -u)
          grouped=$(echo "GeneralProcessTests ProductPublicationTests ProcessTests LifeProcessTests HealthProcessTests EnterpriseProcessTests" | tr ' ' '\n' | sort)
          if [ "$listed" != "$grouped" ]; then
            echo "End-to-end classes and the groups differ:"; diff <(echo "$listed") <(echo "$grouped"); exit 1
          fi
          tests/Insys.EndToEndTests/bin/Release/net10.0/Insys.EndToEndTests -list methods | python3 tools/end-to-end-shards.py --check-class GeneralProcessTests 3

      - name: Endpoint security sweeps (§27.4)
        if: matrix.group == 6
        run: dotnet test --project tests/Insys.IntegrationTests --no-build --configuration Release -- --filter-class "*EndpointSecuritySweepTests"

      - name: End-to-end processes (${{ matrix.classes }}${{ matrix.shard && format(', shard {0} of 3', matrix.shard) || '' }})
        env:
          INSYS_STALL_LOG: ${{ runner.temp }}/stall-sweeps-${{ matrix.group }}.log
        run: |
          app=tests/Insys.EndToEndTests/bin/Release/net10.0/Insys.EndToEndTests
          if [ -n "${{ matrix.shard }}" ]; then
            filters=$($app -list methods | python3 tools/end-to-end-shards.py --class ${{ matrix.classes }} ${{ matrix.shard }} 3)
          else
            filters=$(for c in ${{ matrix.classes }}; do printf -- '-class "Insys.EndToEndTests.%s" ' "$c"; done)
          fi
          mkdir -p "$RUNNER_TEMP/results"
          eval "$app -reporter verbose -noAutoReporters -noColor -result-xml \"$RUNNER_TEMP/results/sweeps-${{ matrix.group }}.xml\" $filters"

      # Each method's seconds in this job's own log, as the dated jobs give theirs (tools/end-to-end-shards.py --measure reads job logs).
      - name: Method times
        if: always()
        run: |
          report="$RUNNER_TEMP/results/sweeps-${{ matrix.group }}.xml"
          if [ -f "$report" ]; then python3 tools/end-to-end-shards.py --times "$report"; else echo "No report: the run was cut off."; fi

      - name: Stall summary
        if: always()
        run: python3 tools/stall-summary.py "${{ runner.temp }}/stall-sweeps-${{ matrix.group }}.log" 40

  # The process flows that turn on dates (billing, Life, Health, General) on fixed clocks (Wave 3 batch 1), so a result
  # never depends on the day CI runs: the 28th, 30th and 31st of a month, 29 February in a leap year, and 23:30 UTC on a
  # month end (the next business day in Johannesburg). The names are WindowClock.Dates; the job name says the date.
  # Each date runs as four shards by test method (OQ-129, Ade, 19 November 2026): as two jobs by class they took 20 to 42
  # minutes against the 45-minute limit, and their stall summaries showed a starved runner, not a stuck test. Each shard
  # takes a balanced share of every dated class's methods (tools/end-to-end-shards.py, weighed by method-timings.json),
  # and every dated method runs in exactly one shard (checked below). A stalled shard isn't rerun to get past it, except
  # on the same head inside the same run.
  end-to-end-dates:
    runs-on: ubuntu-latest
    # 30 minutes, from 45: the longest shard took 14 (run 44602526513), and a stalled shard is cut off sooner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        clock: [28th, 30th, 31st, leap-29-feb, 2330-utc-month-end]
        shard: [1, 2, 3, 4]
    name: end-to-end on ${{ matrix.clock }} (${{ matrix.shard }} of 4)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      - name: Every end-to-end class is dated or not, and every dated method runs in exactly one shard
        run: tests/Insys.EndToEndTests/bin/Release/net10.0/Insys.EndToEndTests -list methods | python3 tools/end-to-end-shards.py --check 4

      - name: Process flows on ${{ matrix.clock }} (shard ${{ matrix.shard }} of 4)
        env:
          INSYS_TEST_CLOCK: ${{ matrix.clock }}
          INSYS_STALL_LOG: ${{ runner.temp }}/stall-${{ matrix.clock }}-${{ matrix.shard }}.log
        run: |
          app=tests/Insys.EndToEndTests/bin/Release/net10.0/Insys.EndToEndTests
          filters=$($app -list methods | python3 tools/end-to-end-shards.py ${{ matrix.shard }} 4)
          mkdir -p "$RUNNER_TEMP/results"
          eval "$app -reporter verbose -noAutoReporters -noColor -result-xml \"$RUNNER_TEMP/results/dates-${{ matrix.clock }}-${{ matrix.shard }}.xml\" $filters"

      # Each method's seconds in this job's own log, for the next rebalance (tools/end-to-end-shards.py --measure reads job logs).
      - name: Method times
        if: always()
        run: |
          report="$RUNNER_TEMP/results/dates-${{ matrix.clock }}-${{ matrix.shard }}.xml"
          if [ -f "$report" ]; then python3 tools/end-to-end-shards.py --times "$report"; else echo "No report: the run was cut off."; fi

      # The stall log's summary in this job's own log (OQ-129, Ade, 19 November 2026), readable through the API when the job is cut off:
      # each stalled test, how long it had run, its last report, and the log's last lines.
      - name: Stall summary
        if: always()
        run: python3 tools/stall-summary.py "${{ runner.temp }}/stall-${{ matrix.clock }}-${{ matrix.shard }}.log" 40

      # Stall logging (OQ-129, the 30th-clock slowness): what each test that ran past 90 seconds waited on, kept even when the job is cancelled.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-${{ matrix.clock }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/stall-${{ matrix.clock }}-${{ matrix.shard }}.log
          if-no-files-found: ignore
