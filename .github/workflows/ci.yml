name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Three test jobs run in parallel, each well inside 30 minutes (checkpoint A): unit and architecture tests; integration
# tests; and the endpoint security sweeps with the end-to-end processes. Each builds with warnings as errors.
jobs:
  unit-and-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # File-sync conflict copies ("Foo 2.cs", "bin/Debug 2") once broke the build (OQ-039).
      - name: No conflict copies
        run: |
          copies=$(find . -path ./.git -prune -o \( -name '* 2.*' -o -name '* 2' \) -print)
          if [ -n "$copies" ]; then
            echo "Conflict copies found:"; echo "$copies"; exit 1
          fi

      # Every source file we own carries the OpenFactor header with its component (tools/source-header.txt).
      - name: Source file headers
        run: python3 tools/source-headers.py --check

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      # TreatWarningsAsErrors is set in Directory.Build.props. The host build also writes the OpenAPI documents.
      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      # Every test project except the two that need PostgreSQL.
      - name: Unit and architecture tests
        run: |
          for project in tests/Insys.*Tests/*.csproj; do
            case "$project" in
              */Insys.IntegrationTests/*|*/Insys.EndToEndTests/*) continue ;;
            esac
            dotnet test --project "$project" --no-build --configuration Release
          done

      - name: OpenAPI documents are committed and current
        run: git diff --exit-code docs/api/

  integration:
    runs-on: ubuntu-latest
    # 30 minutes in one job on Wave 1 batch 3 (limit 45), so the classes are split into two shards that run in parallel,
    # each with its own PostgreSQL container (tools/integration-shards.py; every class is in exactly one shard).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: integration (${{ matrix.shard }} of 2)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Every integration class is in exactly one shard
        run: python3 tools/integration-shards.py --check 2

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      # Testcontainers starts postgres:18 (Docker is available on ubuntu-latest). The endpoint sweeps run in their own job.
      - name: Integration tests
        run: eval dotnet test --project tests/Insys.IntegrationTests --no-build --configuration Release -- $(python3 tools/integration-shards.py ${{ matrix.shard }} 2)

  sweeps-and-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      - name: Endpoint security sweeps (§27.4)
        run: dotnet test --project tests/Insys.IntegrationTests --no-build --configuration Release -- --filter-class "*EndpointSecuritySweepTests"

      - name: End-to-end processes
        run: dotnet test --project tests/Insys.EndToEndTests --no-build --configuration Release
