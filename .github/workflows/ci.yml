name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      # File-sync conflict copies ("Foo 2.cs", "bin/Debug 2") once broke the build (OQ-039).
      - name: No conflict copies
        run: |
          copies=$(find . -path ./.git -prune -o \( -name '* 2.*' -o -name '* 2' \) -print)
          if [ -n "$copies" ]; then
            echo "Conflict copies found:"; echo "$copies"; exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      # TreatWarningsAsErrors is set in Directory.Build.props. The host build also writes the OpenAPI document,
      # which the contract tests compare with docs/api/openapi-v1.json.
      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      # Integration tests start postgres:18 with Testcontainers (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test --solution Insys.slnx --no-build --configuration Release

      - name: OpenAPI documents are committed and current
        run: git diff --exit-code docs/api/
