name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The test jobs run in parallel (checkpoint A): unit and architecture tests; integration tests in three shards balanced
# from measured class times; and the endpoint security sweeps with the end-to-end processes. Each builds with warnings
# as errors.
jobs:
  unit-and-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # File-sync conflict copies ("Foo 2.cs", "bin/Debug 2") once broke the build (OQ-039).
      - name: No conflict copies
        run: |
          copies=$(find . -path ./.git -prune -o \( -name '* 2.*' -o -name '* 2' \) -print)
          if [ -n "$copies" ]; then
            echo "Conflict copies found:"; echo "$copies"; exit 1
          fi

      # Every source file we own carries the OpenFactor header with its component (tools/source-header.txt).
      - name: Source file headers
        run: python3 tools/source-headers.py --check

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      # TreatWarningsAsErrors is set in Directory.Build.props. The host build also writes the OpenAPI documents.
      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      # Every test project in the solution runs in exactly one job: here (tests/Insys.*Tests) or, for the two that need
      # PostgreSQL, in the integration and sweeps-and-end-to-end jobs. A test project outside that pattern fails here.
      - name: Every test project runs in a job
        run: |
          strays=$(grep -oE 'tests/[^"]+\.csproj' Insys.slnx | grep -vE '^tests/Insys\.[A-Za-z.]*Tests/' | grep -v '^tests/Insys.Testing/' || true)
          if [ -n "$strays" ]; then
            echo "Test projects no job runs:"; echo "$strays"; exit 1
          fi

      # Every test project except the two that need PostgreSQL.
      - name: Unit and architecture tests
        run: |
          for project in tests/Insys.*Tests/*.csproj; do
            case "$project" in
              */Insys.IntegrationTests/*|*/Insys.EndToEndTests/*) continue ;;
            esac
            dotnet test --project "$project" --no-build --configuration Release
          done

      - name: OpenAPI documents are committed and current
        run: git diff --exit-code docs/api/

  # The integration split for this run, made once so every shard runs the same split: from the class times the latest
  # successful run on main measured (its integration-timings artifact), else the committed timings file. A class never
  # measured is estimated from its tests (tools/integration-shards.py).
  integration-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Latest measured class times from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ] && gh run download "$run" --repo "$GITHUB_REPOSITORY" --name integration-timings --dir /tmp/main-timings; then
            cp /tmp/main-timings/class-timings.json tests/Insys.IntegrationTests/class-timings.json
            echo "Balanced from the class times of main's run $run."
          else
            echo "No measured times from main; balanced from the committed tests/Insys.IntegrationTests/class-timings.json."
          fi

      - name: Every integration class is in exactly one shard
        run: python3 tools/integration-shards.py --check 4

      - uses: actions/upload-artifact@v4
        with:
          name: integration-plan
          path: tests/Insys.IntegrationTests/class-timings.json

  integration:
    needs: integration-plan
    runs-on: ubuntu-latest
    # 30 minutes in one job on Wave 1 batch 3, two shards from then, three from Wave 2 batch 4 (two passed 42 minutes),
    # four from 29 October 2026 (a shard reached 29.5 minutes; Ade: every job well under 20), each with its own
    # PostgreSQL container. The 45-minute limit is the alarm: the timings job warns past 35.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: integration (${{ matrix.shard }} of 4)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: integration-plan
          path: tests/Insys.IntegrationTests

      - name: Every integration class is in exactly one shard
        run: python3 tools/integration-shards.py --check 4

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      - name: Every compiled integration class runs in a shard or the sweeps job
        run: tests/Insys.IntegrationTests/bin/Release/net10.0/Insys.IntegrationTests -list classes | python3 tools/integration-shards.py --check-listed 4

      # Testcontainers starts postgres:18 (Docker is available on ubuntu-latest). The endpoint sweeps run in their own job.
      # The xUnit report gives each class's measured time to the timings job.
      - name: Integration tests
        run: >-
          eval dotnet test --project tests/Insys.IntegrationTests --no-build --configuration Release --results-directory "$RUNNER_TEMP/results"
          -- --report-xunit-xml --report-xunit-xml-filename shard-${{ matrix.shard }}.xml $(python3 tools/integration-shards.py ${{ matrix.shard }} 4)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/results/shard-${{ matrix.shard }}.xml
          if-no-files-found: warn

  # Measures every class from the shards' reports into the integration-timings artifact the next run balances from (a
  # class whose shard wrote no report keeps its last time), and reports each shard's time, warning past 35 minutes.
  integration-timings:
    needs: [integration-plan, integration]
    if: always() && needs.integration-plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: integration-plan
          path: tests/Insys.IntegrationTests

      - uses: actions/download-artifact@v4
        with:
          pattern: integration-report-*
          path: reports
          merge-multiple: true

      - name: Measure each class
        env:
          INSYS_SHARD_SOURCE: CI run ${{ github.run_id }} (${{ github.ref_name }}, ${{ github.sha }})
        run: python3 tools/integration-shards.py --measure reports/*.xml

      - uses: actions/upload-artifact@v4
        with:
          name: integration-timings
          path: tests/Insys.IntegrationTests/class-timings.json

      - name: Shard times
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A shard that has only just finished may not show its completion time yet: it is measured to now.
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.name | startswith("integration (")) | [.name, .startedAt, (.completedAt // ""), (.conclusion // "")] | @tsv' | sort |
          while IFS=$'\t' read -r name started completed conclusion; do
            case "$completed" in ""|0001-*) end=$(date +%s) ;; *) end=$(date -d "$completed" +%s) ;; esac
            seconds=$(( end - $(date -d "$started" +%s) ))
            minutes="$(( seconds / 60 )).$(( seconds % 60 * 10 / 60 ))"
            echo "$name: $minutes min (${conclusion:-finishing})" | tee -a "$GITHUB_STEP_SUMMARY"
            # Past 35 minutes to the second: 35 min 30 s is over the alarm, though it rounds down to 35.
            if [ "$seconds" -gt 2100 ]; then echo "::warning title=Integration shard over 35 minutes::$name took $minutes minutes (limit 45)."; fi
          done

  # Two jobs from 29 October 2026 (one took 27.6 minutes; Ade: every job well under 20), split by end-to-end test class.
  # Every end-to-end class runs in exactly one group (checked below), so a new class cannot be left out.
  sweeps-and-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            classes: GeneralProcessTests ProductPublicationTests ProcessTests
          - group: 2
            classes: LifeProcessTests HealthProcessTests EnterpriseProcessTests
    name: sweeps-and-end-to-end (${{ matrix.group }} of 2)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      - name: Every end-to-end class runs in exactly one group
        run: |
          listed=$(tests/Insys.EndToEndTests/bin/Release/net10.0/Insys.EndToEndTests -list classes | grep -oE 'Insys\.EndToEndTests\.[A-Za-z]+' | sed 's/.*\.//' | sort -u)
          grouped=$(echo "GeneralProcessTests ProductPublicationTests ProcessTests LifeProcessTests HealthProcessTests EnterpriseProcessTests" | tr ' ' '\n' | sort)
          if [ "$listed" != "$grouped" ]; then
            echo "End-to-end classes and the groups differ:"; diff <(echo "$listed") <(echo "$grouped"); exit 1
          fi

      - name: Endpoint security sweeps (§27.4)
        if: matrix.group == 1
        run: dotnet test --project tests/Insys.IntegrationTests --no-build --configuration Release -- --filter-class "*EndpointSecuritySweepTests"

      - name: End-to-end processes (${{ matrix.classes }})
        run: >-
          dotnet test --project tests/Insys.EndToEndTests --no-build --configuration Release --
          $(for c in ${{ matrix.classes }}; do printf -- '--filter-class "*.%s" ' "$c"; done)

  # The process flows that turn on dates (billing, Life, Health, General) on fixed clocks (Wave 3 batch 1), so a result
  # never depends on the day CI runs: the 28th, 30th and 31st of a month, 29 February in a leap year, and 23:30 UTC on a
  # month end (the next business day in Johannesburg). The names are WindowClock.Dates; the job name says the date.
  # Each date runs as two jobs from 29 October 2026, by class (General alone, then Life, Health and Enterprise), so each
  # runs well under 20 minutes (OQ-129: one ran into the 30-minute limit).
  end-to-end-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        clock: [28th, 30th, 31st, leap-29-feb, 2330-utc-month-end]
        group: [general, life-health-enterprise]
    name: end-to-end on ${{ matrix.clock }} (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Insys.slnx

      - name: Build
        run: dotnet build Insys.slnx --no-restore --configuration Release -warnaserror

      - name: Process flows on ${{ matrix.clock }}
        env:
          INSYS_TEST_CLOCK: ${{ matrix.clock }}
          INSYS_STALL_LOG: ${{ runner.temp }}/stall-${{ matrix.clock }}-${{ matrix.group }}.log
        run: >-
          dotnet test --project tests/Insys.EndToEndTests --no-build --configuration Release --
          ${{ matrix.group == 'general' && '--filter-class "*.GeneralProcessTests"' || '--filter-class "*.LifeProcessTests" --filter-class "*.HealthProcessTests" --filter-class "*.EnterpriseProcessTests"' }}

      # Stall logging (OQ-129, the 30th-clock slowness): what each test that ran past 90 seconds waited on, kept even when the job is cancelled.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-${{ matrix.clock }}-${{ matrix.group }}
          path: ${{ runner.temp }}/stall-${{ matrix.clock }}-${{ matrix.group }}.log
          if-no-files-found: ignore
