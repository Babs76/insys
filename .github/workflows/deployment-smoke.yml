name: deployment-smoke

# ADR-027: the proof of cloud neutrality. Its own workflow, as it deploys the full stack: on main when what it deploys changes, and by hand on a branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/**
      - db/**
      - src/BuildingBlocks/Insys.BuildingBlocks.Cloud/**
      - .github/workflows/deployment-smoke.yml

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: helm/kind-action@v1
        with:
          cluster_name: insys-smoke

      - name: Build and load the images
        run: |
          docker build -q -f deploy/docker/api.Dockerfile -t insys-api:smoke .
          docker build -q -f deploy/docker/migrator.Dockerfile -t insys-migrator:smoke .
          kind load docker-image insys-api:smoke insys-migrator:smoke --name insys-smoke

      # The console's image is private: the workflow's own token reads it (the package gives this repository read access). It's pulled by the
      # digest the chart pins and loaded into the cluster, so the cluster needs no pull secret here; the Preview uses one.
      - name: The console's image, by the chart's digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=$(sed -n 's/^  image: \(ghcr.io\/[^ ]*@sha256:[0-9a-f]*\).*/\1/p' deploy/helm/insys/values.yaml)
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin > /dev/null
          if ! docker pull -q "$image"; then
            # What the workflow's token can see of the package: its versions' digests and tags, to compare with the pinned one.
            GH_TOKEN="$GHCR_TOKEN" gh api /users/babs76/packages/container/insys-console-web/versions \
              --jq '.[0:10][] | [.name, (.metadata.container.tags | join(","))] | @tsv' || echo "The token can't list the package's versions."
            exit 1
          fi
          docker tag "$image" insys-console:smoke
          kind load docker-image insys-console:smoke --name insys-smoke

      - name: Deploy and smoke test
        run: deploy/smoke/run.sh
