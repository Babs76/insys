# The INSYS Preview (docs/plans/insys-preview.md): one Hetzner server with k3s and the chart, sample data only. Run by hand, in the
# Environment "preview", which needs Ade's approval. Ade sets HCLOUD_TOKEN, PREVIEW_SSH_KEY and PREVIEW_CONSOLE_PULL_TOKEN (a classic PAT with
# read:packages only, for the console's private image) as its secrets, and PREVIEW_DOMAIN, PREVIEW_AGE_RECIPIENT, PREVIEW_LOCATION and
# PREVIEW_SERVER_TYPE (fsn1 and cpx42, Ade, 3 November) and, optionally, PREVIEW_ACME_EMAIL and PREVIEW_CONSOLE_PULL_USER as its variables. The only artifact is the file encrypted to Ade's age key, as
# this repository is public; nothing secret is printed, and the inputs (also public) never carry one.
name: preview

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [check, diagnose, provision, upgrade, upgrade-check, open-ssh, backup, restore, os-update, reboot, keycloak-theme, keycloak-theme-revert, rotate-ssh-key, reset, rotate-passwords, destroy]
      confirm:
        description: For upgrade-check, restore, os-update, reboot, keycloak-theme, keycloak-theme-revert, rotate-ssh-key, reset, rotate-passwords and destroy, type the action's name
        default: ""
      ssh_from:
        description: For open-ssh and restore, the address to allow (your own IP)
        default: ""
      backup_day:
        description: For restore, the backup's date (yyyy-mm-dd)
        default: ""
      acme:
        description: Let's Encrypt's staging service until issuance is proven, then production
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 330   # Ade, 24 November 2026: a reset took 3 h 23 min (the seed 3 h 0 min, its accounts stage 53 min); GitHub-hosted jobs stop at 6 h. rotate-passwords runs the whole seed too; a cut-off run is recoverable (it resumes, and sets all 51 passwords at the end)
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
      PREVIEW_SSH_KEY_NEW: ${{ secrets.PREVIEW_SSH_KEY_NEW }}
      PREVIEW_ALERT_TO: ${{ secrets.PREVIEW_ALERT_TO }}
      PREVIEW_CONSOLE_PULL_TOKEN: ${{ secrets.PREVIEW_CONSOLE_PULL_TOKEN }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      PREVIEW_AGE_RECIPIENT: ${{ vars.PREVIEW_AGE_RECIPIENT }}
      PREVIEW_ACME_EMAIL: ${{ vars.PREVIEW_ACME_EMAIL }}
      PREVIEW_LOCATION: ${{ vars.PREVIEW_LOCATION }}
      PREVIEW_SERVER_TYPE: ${{ vars.PREVIEW_SERVER_TYPE }}
      PREVIEW_CONSOLE_PULL_USER: ${{ vars.PREVIEW_CONSOLE_PULL_USER }}
      PREVIEW_ACME: ${{ inputs.acme }}
      PREVIEW_BACKUP_DAY: ${{ inputs.backup_day }}
    steps:
      - name: Confirmation
        if: contains(fromJSON('["upgrade-check", "restore", "os-update", "reboot", "keycloak-theme", "keycloak-theme-revert", "rotate-ssh-key", "reset", "rotate-passwords", "destroy"]'), inputs.action) && inputs.confirm != inputs.action
        run: |
          echo "::error::Type the action's name in confirm to ${{ inputs.action }}."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Tools (hcloud, checked against its published checksum, and age)
        run: |
          version=v1.70.2   # current on 4 November 2026; it has no datacenter flags (removed by Hetzner, 1 July 2026)
          cd "$RUNNER_TEMP"
          curl -sfLO --retry 3 --retry-all-errors --retry-delay 5 "https://github.com/hetznercloud/cli/releases/download/$version/hcloud-linux-amd64.tar.gz"
          curl -sfLO --retry 3 --retry-all-errors --retry-delay 5 "https://github.com/hetznercloud/cli/releases/download/$version/checksums.txt"
          grep ' hcloud-linux-amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf hcloud-linux-amd64.tar.gz hcloud && sudo install hcloud /usr/local/bin/hcloud
          sudo apt-get install -y -qq age > /dev/null

      # The login theme check's browser (BR-168), for the two Keycloak theme actions only: Playwright 1.63.0 (Apache-2.0, the version the check
      # was proven with locally) and its Chromium, outside the checkout. Node is the runner's own.
      - name: Playwright, for the login theme check
        if: inputs.action == 'keycloak-theme' || inputs.action == 'keycloak-theme-revert'
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-audit --no-fund playwright@1.63.0 > /dev/null
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium > /dev/null
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"

      - name: ${{ inputs.action }}
        env:
          SSH_FROM: ${{ inputs.ssh_from }}
        run: |
          RUNNER_IP="$(curl -sf --retry 3 --retry-all-errors --retry-delay 5 https://api.ipify.org)"
          export RUNNER_IP
          deploy/preview/preview.sh "${{ inputs.action }}" ${SSH_FROM:+"$SSH_FROM"}

      - name: The file for Ade, encrypted to his key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-secrets
          path: ${{ runner.temp }}/preview-secrets.age
          retention-days: 90   # it may hold OpenBao's unseal key, needed for every unseal (one day lost run 41835262697's); encrypted to Ade's key only
          if-no-files-found: ignore
