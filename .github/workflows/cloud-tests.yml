name: cloud-tests

# The real Huawei Cloud tests (DEW KMS and OBS in af-south-1; HuaweiCloudTests), run by hand or weekly. Each job
# runs only when its secrets exist in the repository; otherwise it is skipped and the workflow passes.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  huawei-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INSYS_HUAWEI_AK: ${{ secrets.INSYS_HUAWEI_AK }}
      INSYS_HUAWEI_SK: ${{ secrets.INSYS_HUAWEI_SK }}
      INSYS_HUAWEI_PROJECT_ID: ${{ secrets.INSYS_HUAWEI_PROJECT_ID }}
      INSYS_HUAWEI_KMS_KEY_ID: ${{ secrets.INSYS_HUAWEI_KMS_KEY_ID }}
      INSYS_HUAWEI_OBS_BUCKET: ${{ secrets.INSYS_HUAWEI_OBS_BUCKET }}
      INSYS_HUAWEI_REGION: ${{ vars.INSYS_HUAWEI_REGION }}
    steps:
      - name: Credentials present
        id: credentials
        run: |
          if [ -n "$INSYS_HUAWEI_AK" ] && [ -n "$INSYS_HUAWEI_SK" ] && [ -n "$INSYS_HUAWEI_PROJECT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No INSYS_HUAWEI_* secrets: the real-cloud tests are skipped."
          fi

      - uses: actions/checkout@v5
        if: steps.credentials.outputs.present == 'true'

      - uses: actions/setup-dotnet@v5
        if: steps.credentials.outputs.present == 'true'
        with:
          global-json-file: global.json

      - name: Real-cloud tests
        if: steps.credentials.outputs.present == 'true'
        run: dotnet test --project tests/Insys.BuildingBlocks.Tests --configuration Release -- --filter-class "*HuaweiCloudTests"
