name: assist-eval

# The AI-2 evaluation against Claude (ai-assist.md §6 and §7, batch 7.3), run by hand only: no real model is called in CI (AI Assist SRS §9.2).
# It runs in the Environment assist-eval, whose required reviewer approves each run, and reads the key from its secret ASSIST_CLAUDE_API_KEY.
# The same set on each model, one model after another so their times don't disturb each other, then the models compared side by side (Ade, 15 November).
# Sample data only: docs/evaluation/ai2-evaluation-set.json, the error catalogue's wording and the sample products' invented rates. Each model's reports
# (summary.md, review.csv for the domain expert, results.json) and the comparison are the run's artifacts, and the comparison is its summary page.
on:
  workflow_dispatch:
    inputs:
      models:
        description: The models to compare, as a JSON list
        default: '["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]'
      effort:
        description: low, medium, high, xhigh or max
        default: medium
      inference_geo:
        description: Where inference must run (inference_geo), or empty to leave it to the route; what ran is recorded either way
        default: us

permissions:
  contents: read

concurrency:
  group: assist-eval
  cancel-in-progress: false

jobs:
  evaluate:
    # From main only: a branch's code never runs with the key. The Environment is limited to main as well (Ade, 15 November).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: assist-eval
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Evaluate ${{ matrix.model }}
        env:
          Assist__Claude__ApiKey: ${{ secrets.ASSIST_CLAUDE_API_KEY }}
          Assist__ModelVersion: ${{ matrix.model }}
          Assist__Claude__Effort: ${{ inputs.effort }}
          Assist__Claude__InferenceGeo: ${{ inputs.inference_geo }}
          OUT: ${{ runner.temp }}/assist-evaluation/${{ matrix.model }}
        run: |
          dotnet run --project tools/Insys.Assist.Evaluation -c Release -- \
            --set docs/evaluation/ai2-evaluation-set.json --config src/Host/Insys.Api/appsettings.json --provider claude --out "$OUT"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assist-evaluation-${{ matrix.model }}
          path: ${{ runner.temp }}/assist-evaluation/${{ matrix.model }}
          retention-days: 30
          if-no-files-found: ignore

  compare:
    needs: evaluate
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: assist-evaluation-*
          path: ${{ runner.temp }}/runs
      - name: Compare the models
        env:
          RUNS: ${{ runner.temp }}/runs
          OUT: ${{ runner.temp }}/comparison
        run: |
          folders=$(find "$RUNS" -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/run.json' ';' -print | sort)
          [ -n "$folders" ] || { echo "No model's run finished."; exit 1; }
          dotnet run --project tools/Insys.Assist.Evaluation -c Release -- --compare $folders --out "$OUT"
          cat "$OUT/comparison.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: assist-evaluation-comparison
          path: ${{ runner.temp }}/comparison
          retention-days: 30
