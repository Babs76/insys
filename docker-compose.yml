# Local development database: PostgreSQL 18.
#   docker compose up -d postgres
#   INSYS_ROLE_PASSWORD=insys_local dotnet run --project tools/Insys.DbMigrator -- \
#     --connection "Host=localhost;Port=5432;Database=insys;Username=insys_owner;Password=insys_owner_local" --roles db/roles \
#     --bootstrap-operator 0199f000-0000-7000-8000-000000000001 --admin-subject <your IdP subject>
#   dotnet run --project src/Host/Insys.Api
# The owner runs migrations; each module connects as its own non-owner role without BYPASSRLS (DBA-002, DBA-004),
# through ConnectionStrings:Template in appsettings.Development.json.
# Local-only credentials. Never reuse them anywhere else.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: insys
      POSTGRES_USER: insys_owner
      POSTGRES_PASSWORD: insys_owner_local
    ports:
      # Set INSYS_PG_PORT if 5432 is taken (for example by a local PostgreSQL), and point
      # ConnectionStrings__Template at the same port.
      - "${INSYS_PG_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - insys-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insys_owner -d insys"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  insys-pgdata:
